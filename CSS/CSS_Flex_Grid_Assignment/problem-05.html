<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #mainbox{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            grid-template-rows:repeat(3,1fr);
            gap: 20px;
            border-radius: 10px;
           
            justify-self:center;
            width:800px;
            height:300px
           
        }

        #mainbox div{
            background-color: rgba(3, 73, 39, 0.979);
            color: white;
            font-size: 30px;
            padding: 10px;
            
        }
    </style>
</head>
<body>
    <div id="mainbox">
        <div style="grid-area: 1/1/2/2;"></div>
        <div style="grid-row: span 2;grid-area: 1/2/2/4"></div>
        <div style="grid-area: 1/4/2/5"></div>
        <div style="grid-row: span 2;grid-area: 2/1/3/3"></div>
        <div style="grid-area: 2/3/3/4"></div>
        <div style="grid-area: 2/4/3/5"></div>
        <div style="grid-area: 3/1/4/2;"></div>
        <div style="grid-area: 3/2/4/3;"></div>
        <div style="grid-row: span 2; grid-area: 3/3/4/5"></div>
    </div>
</body>
</html>
