<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #mainbox{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            grid-template-rows:repeat(2,1fr);
            gap: 10px;
            border-radius: 10px;
           
            justify-self:center;
            width:800px;
            height:250px
           
        }

        #mainbox div{
            background-color: rgb(69, 69, 69);
            color: white;
            font-size: 30px;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="mainbox">
        <div style="grid-row: span 2;grid-area: 1/1/2/3;">A</div>
        <div style="grid-column: span 2;grid-area: 1/3/3/4">B</div>
        <div style="grid-column: span 2;grid-area: 1/4/3/5">E</div>
        <div>D</div>
        <div>C</div>
    </div>
</body>
</html>
